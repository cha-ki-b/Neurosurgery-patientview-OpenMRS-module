# nginx.conf - TLS-terminating reverse proxy for OpenMRS + Orthanc.
#
# Routing:
#   https://<host>/openmrs/...  -> openmrs-app:8080   (OpenMRS reference application)
#   https://<host>/orthanc/...  -> orthanc-pacs:8042   (Orthanc Explorer / REST API)
#   http://<host>/...           -> redirected to https

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Never send the nginx version number in error pages / headers.
    server_tokens off;

    # Redirect all plain HTTP to HTTPS.
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Modern TLS only - disable the old, broken protocol/cipher versions.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Defense-in-depth headers.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;

        client_max_body_size 200M; # DICOM studies uploaded through Orthanc's REST API can be large

        location /openmrs/ {
            proxy_pass http://openmrs-app:8080/openmrs/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /orthanc/ {
            proxy_pass http://orthanc-pacs:8042/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            return 301 /openmrs/;
        }
    }
}
